# OpenSpec SDD Configuration
# Generated by sdd-init (openspec mode)

schema: spec-driven

project:
  name: fundo_nueva_aurora
  path: /Users/ortijm/Documents/proyectos_personales/Proyecto Condominio Nueva Aurora/fundo_nueva_aurora
  description: Condominium management system for "Condominio Nueva Aurora" - Next.js 16 + TypeScript + Prisma
  roles: ADMINISTRADOR, PROPIETARIO
  language: es

context: |
  Tech stack: Next.js 16.2.1, TypeScript 5, Prisma 5.22 (PostgreSQL), NextAuth v5 (Credentials + JWT), bcryptjs, zod, react-hook-form
  UI: Tailwind CSS v4, shadcn/ui (Radix primitives), Lucide icons, Sonner toasts
  Email: Resend + Nodemailer for notifications
  PDF: @react-pdf/renderer for billing PDFs
  Excel: xlsx for meter reading imports
  Charts: Recharts
  Storage: @vercel/blob

  Architecture:
  - Server Actions para todas las mutaciones
  - Prisma singleton pattern
  - NextAuth v5 con JWT y Credentials provider
  - Componentes de servidor por defecto, client components solo donde necesario
  - Decimal handling para valores monetarios

testing:
  runner: none
  strict_tdd: false
  coverage_threshold: 0
  test_command: ""
  build_command: "npm run build"
  reason: "No test runner configured. Project lacks test infrastructure (no Vitest, Jest, or test scripts)."

lint:
  tool: eslint
  config: eslint.config.mjs
  command: "npm run lint"
  rules:
    - Using eslint-config-next (core-web-vitals + typescript)
    - Next.js 16 specific rules enabled

type_check:
  tool: typescript
  strict: true
  command: "npx tsc --noEmit"

format:
  tool: none
  detected: false
  note: "No Prettier config detected"

database:
  orm: prisma
  provider: postgresql
  connection: DATABASE_URL env var
  migrations: prisma migrate
  seed: npm run db:seed

rules:
  proposal:
    - Include rollback plan for risky changes
    - Document affected modules in changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Spanish language for business logic descriptions
  design:
    - Document architecture decisions with rationale
    - Include database schema changes in Prisma migrations
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns from CLAUDE.md
    - Use Server Actions for mutations
    - Handle Decimal types properly
    tdd: false
  verify:
    - Run npm run build to verify compilation
    - Test manually for UI changes
  archive:
    - Warn before merging destructive deltas

conventions:
  - Server Actions: "use server" + auth check pattern
  - Components: server-first, client only when needed
  - Auth: NextAuth v5 with JWT strategy, Credentials provider
  - Forms: react-hook-form + zod validation
  - Database: Prisma with Decimal for money, avoid float
  - Design: No borders, use surface color shifts

migration_plan:
  note: "Planning parallel project copy as part of migration plan"
  related_project: fundo_nueva_aurora_v2 (planned)